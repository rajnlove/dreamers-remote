services:
  # Milestone 1 proof of concept: browser -> noVNC -> websockify -> UltraVNC.
  # This is the only service required to validate remote access works.
  novnc:
    build:
      context: ..
      dockerfile: docker/novnc.Dockerfile
    environment:
      VNC_TARGET_HOST: ${VNC_TARGET_HOST}
      VNC_TARGET_PORT: ${VNC_TARGET_PORT:-5900}
      NOVNC_LISTEN_PORT: 6080
    ports:
      - "${NOVNC_PORT:-6080}:6080"
    restart: unless-stopped

  # Backend API + WebSocket VNC proxy + Wake-on-LAN sender.
  # network_mode: host is required for M5's Wake-on-LAN: a UDP broadcast
  # magic packet sent from inside Docker's default bridge network never
  # reaches the physical LAN (it's confined to the bridge's own isolated
  # subnet). Host networking puts the container directly on the LAN
  # interface, same as UltraVNC's broadcast-based discovery would expect.
  # If host networking isn't available in your environment, Wake-on-LAN
  # will silently fail to reach real hardware even though the API call
  # itself succeeds — see docs/PROJECT_STATUS.md.
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    network_mode: host
    environment:
      APP_PORT: 8080
      DATABASE_FILE: ${DATABASE_FILE:-/data/dreamers-remote.sqlite}
    volumes:
      - ${DATA_ROOT:-./data}:/data
    restart: unless-stopped

  # Milestone 3+ dashboard. Builds and runs now as a placeholder page.
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - server
