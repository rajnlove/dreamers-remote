server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # web/src/App.tsx uses BrowserRouter (HTML5 history API), so routes like
    # /remote/4 only exist client-side. Without this fallback, a direct
    # load or refresh of anything but "/" 404s at the nginx layer before
    # React Router ever gets a chance to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
