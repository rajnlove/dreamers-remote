name: Build and publish Docker images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  verify-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: node --test dist/upload/*.test.js dist/job/idempotency.test.js
        working-directory: server
        env:
          DATABASE_FILE: /tmp/dreamers-job-test.sqlite
  build:
    needs: verify-upload
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: docker/server.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile
          - image: upload
            dockerfile: docker/upload.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dreamers-remote-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/dreamers-remote-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
